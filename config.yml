baseURL: "https://albertobinetti.github.io" 
title: Alberto Binetti
paginate: 20
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Published papers
          url: papers/
          weight: 1
        - name: Work in progress
          url: workinprogress/
          weight: 2


params:
    description: "Hi! I am a Ph.D. candidate in economics at Princeton affiliated with the Industrial Relations Section. I am interested in labor and industrial organization, especially in innovation and inequality. From Naples."
    author: Alberto Binetti
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: "Alberto Binetti"
          subtitle: "Hi! I am a [Ph.D. candidate](https://www.youtube.com/watch?v=qqrCoyVK80I) in economics at <a href='https://economics.princeton.edu' style='font-weight: bold;'>Princeton</a> affiliated with the <a href='https://irs.princeton.edu/students' style='font-weight: bold;'>Industrial Relations Section</a>.
          I received both my Bachelor's and my Master's from <a href='https://www.unibocconi.it/it/node/1' style='font-weight: bold;'>Bocconi</a>.
          <br> <br>
          I am interested in labor and industrial organization, especially in innovation and inequality. From [Naples.](https://www.youtube.com/watch?v=Dqo730l_eCs)
          <br> <br>
          You can find my CV <a href='cv.pdf' style='font-weight: bold;'>here</a>."
          imageUrl: "portraits/headshot-red.jpg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Alberto Binetti
          buttons:
            - name: Published papers
              url: papers/
            - name: Work in progress
              url: workinprogress/

    colorPalettes:
        - id: red
          name: Red-orange
          accent: "#d0311f"
          muted: "#f1b4ad"
          soft: "#fbeae8"
          surface: "#f8f4f3"
          border: "#eee0dd"
          portrait: "portraits/headshot-red.jpg"
          icon: "icons/favicon-red.svg"
        - id: blue
          name: Dark blue
          accent: "#203b63"
          muted: "#bac9dd"
          soft: "#e8eef6"
          surface: "#f2f5f9"
          border: "#dde5ee"
          portrait: "portraits/headshot-blue.jpg"
          icon: "icons/favicon-blue.svg"
        - id: green
          name: Deep green
          accent: "#205541"
          muted: "#b9d2c6"
          soft: "#e7f1eb"
          surface: "#f2f6f3"
          border: "#dce8e0"
          portrait: "portraits/headshot-green.jpg"
          icon: "icons/favicon-green.svg"

    socialIcons:
        - name: Email
          url: mailto:abinetti@princeton.edu
        - name: CV
          url: cv.pdf
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=zUWmT7oAAAAJ&hl=en&oi=ao
        - name: Twitter
          url: https://twitter.com/Al_Bi99

    assets:
        favicon: "favicon-accent.ico"
        favicon16x16: "favicon-accent-16x16.png"
        favicon32x32: "favicon-accent-32x32.png"
        apple_touch_icon: "apple-touch-icon-accent.png"
        disableHLJS: true
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Alberto Binetti"
      icon: favicon-accent.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
