baseURL: "https://albertobinetti.github.io" 
title: Alberto Binetti
paginate: 20
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Published papers
          url: papers/
          weight: 1
        - name: Working papers
          url: workinprogress/
          weight: 2


params:
    homeTitle: "Alberto Binetti | Economics Ph.D. Candidate at Princeton"
    description: "Alberto Binetti is a Ph.D. candidate in economics at Princeton University, studying labor, industrial organization, innovation, and inequality."
    images: ["portraits/headshot-blue.jpg"]
    author: Alberto Binetti
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: "Alberto Binetti"
          subtitle: "Hi! I am a <a class='subtle-link' href='https://www.youtube.com/watch?v=qqrCoyVK80I'>Ph.D. candidate</a> in economics at <a href='https://economics.princeton.edu' style='font-weight: bold;'>Princeton</a> affiliated with the <a href='https://irs.princeton.edu/students' style='font-weight: bold;'>Industrial Relations Section</a>.
          I received both my Bachelor's and my Master's from <a href='https://www.unibocconi.it/it/node/1' style='font-weight: bold;'>Bocconi</a>.
          <br> <br>
          I am interested in labor and industrial organization, especially in innovation and inequality. From <a class='subtle-link' href='https://www.youtube.com/watch?v=Dqo730l_eCs'>Naples.</a>
          <br> <br>
          You can find my CV <a href='cv.pdf' style='font-weight: bold;'>here</a>."
          imageUrl: "portraits/headshot-blue.jpg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Alberto Binetti
          buttons:
            - name: Published papers
              url: papers/
            - name: Working papers
              url: workinprogress/

    colorPalettes:
        - id: blue
          name: Dark blue
          accent: "#203b63"
          muted: "#bac9dd"
          soft: "#e8eef6"
          surface: "#f2f5f9"
          border: "#dde5ee"
          portrait: "portraits/headshot-blue.jpg"
          icon: "icons/favicon-blue.svg"
          favicon: "icons/favicon-blue.png"
          appleicon: "icons/apple-touch-blue.png"
        - id: red
          name: Red-orange
          accent: "#d0311f"
          muted: "#f1b4ad"
          soft: "#fbeae8"
          surface: "#f8f4f3"
          border: "#eee0dd"
          portrait: "portraits/headshot-red.jpg"
          icon: "icons/favicon-red.svg"
          favicon: "icons/favicon-red.png"
          appleicon: "icons/apple-touch-red.png"
        - id: green
          name: Deep green
          accent: "#205541"
          muted: "#b9d2c6"
          soft: "#e7f1eb"
          surface: "#f2f6f3"
          border: "#dce8e0"
          portrait: "portraits/headshot-green.jpg"
          icon: "icons/favicon-green.svg"
          favicon: "icons/favicon-green.png"
          appleicon: "icons/apple-touch-green.png"

        - id: black
          name: Black
          accent: "#181818"
          muted: "#c7c7c7"
          soft: "#ededed"
          surface: "#f5f5f5"
          border: "#dfdfdf"
          portrait: "portraits/headshot-black.jpg"
          icon: "icons/favicon-black.svg"
          favicon: "icons/favicon-black.png"
          appleicon: "icons/apple-touch-black.png"

        - id: pink
          name: Hot pink
          hidden: true
          accent: "#ff1493"
          muted: "#f5b8d8"
          soft: "#fde8f3"
          surface: "#fbf3f8"
          border: "#efdce7"
          portrait: "portraits/headshot-pink.jpg"
          icon: "icons/favicon-pink.svg"
          favicon: "icons/favicon-pink.png"
          appleicon: "icons/apple-touch-pink.png"

    socialIcons:
        - name: Email
          url: mailto:abinetti@princeton.edu
        - name: CV
          url: cv.pdf
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=zUWmT7oAAAAJ&hl=en&oi=ao
        - name: Twitter
          url: https://twitter.com/Al_Bi99

    assets:
        favicon: "icons/favicon-blue.png"
        favicon16x16: "favicon-16x16.png"
        favicon32x32: "favicon-32x32.png"
        apple_touch_icon: "icons/apple-touch-blue.png"
        disableHLJS: true
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Alberto Binetti"
      icon: icons/favicon-blue.svg
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
